<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-arpit-batra.png. Satoshi loads from Fontshare, so render it in Chrome with `npm run og`. -->
  <style>
    @import url("https://api.fontshare.com/v2/css?f[]=satoshi@700&amp;display=block");
    .bio { fill: #1c1b1a; font: 700 48px "Satoshi", sans-serif; letter-spacing: -0.02em; }
  </style>
  <rect width="1200" height="630" fill="#ffffff" />
  <text class="bio">
    <tspan x="80" y="390">Hi! I'm Arpit Batra. I write poems,</tspan>
    <tspan x="80" y="456">philosophy, life updates, and about my</tspan>
    <tspan x="80" y="522">adventures with computers.</tspan>
  </text>
</svg>
